<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Card Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Compass Outer Ring -->
  <circle cx="32" cy="32" r="20" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="23" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Compass Cardinal Dots -->
  <circle cx="32" cy="10" r="1.5" fill="#818cf8"/>
  <circle cx="32" cy="54" r="1.5" fill="#818cf8" fill-opacity="0.5"/>
  <circle cx="10" cy="32" r="1.5" fill="#818cf8" fill-opacity="0.5"/>
  <circle cx="54" cy="32" r="1.5" fill="#818cf8" fill-opacity="0.5"/>

  <!-- Stylized Compass Needles -->
  <!-- North Needle (Indigo / Violet with Glow) -->
  <polygon points="32,13 37.5,30 32,27 26.5,30" fill="url(#needleNorth)" filter="url(#glow)"/>
  
  <!-- South Needle (Rose Red) -->
  <polygon points="32,51 37.5,34 32,37 26.5,34" fill="url(#needleSouth)"/>

  <!-- Center Pivot Ring -->
  <circle cx="32" cy="32" r="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="32" r="1.8" fill="#6366f1"/>
</svg>
